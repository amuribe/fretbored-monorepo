[package]
name = "core_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Music theory engine and string instrument fretboard chord voicing tool"
license = "MIT"
repository = "https://github.com/amuribe/fretbored-monorepo"
keywords = ["music-theory", "chords", "cli", "guitar", "banjo", "ukelele", "mandolin"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "fretbored"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
once_cell = "1"
clap = { version = "4.6", features = ["derive"] } 

[dev-dependencies]
wasm-bindgen-test = "0.3"
